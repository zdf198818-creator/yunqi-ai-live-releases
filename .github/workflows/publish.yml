name: Publish client release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release-assets/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild full installer
        shell: bash
        run: cat release-assets/full-installer.part.* > "release-assets/yunqi-ai-live-v0.9.3-full.zip"

      - name: Verify release assets
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("release-assets/update.json").read_text(encoding="utf-8"))
          package = Path("release-assets/yunqi-ai-live-client-v0.9.3-update.zip")
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          if digest != manifest["sha256"]:
              raise SystemExit("update package SHA256 mismatch")
          print("SHA256 verified:", digest)
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete v0.9.3 --cleanup-tag --yes 2>/dev/null || true
          gh release create v0.9.3 \
            "release-assets/yunqi-ai-live-client-v0.9.3-update.zip" \
            "release-assets/yunqi-ai-live-v0.9.3-full.zip" \
            "release-assets/update.json" \
            --title "云祺 AI 直播 v0.9.3" \
            --notes "用户数据永久保留，新增客户端一键更新，并优化参考音频批量选择。"
