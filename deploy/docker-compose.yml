services:
  tts:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AILIVE_BACKEND: ${AILIVE_BACKEND:-mock}
      AILIVE_API_TOKEN: ${AILIVE_API_TOKEN:-change-me}
    volumes:
      - ../data:/data
      - ../models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
